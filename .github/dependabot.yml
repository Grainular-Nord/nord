version: 2

updates:
    - package-ecosystem: npm
      directories:
          # The root manifest includes all npm workspaces.
          - '/'
          # Starter templates are separate from the workspace dependency tree.
          - '/packages/@grainular/create-nord/templates/vite'
          - '/packages/@grainular/create-nord/templates/vite-ts'
      schedule:
          interval: monthly
      open-pull-requests-limit: 1
      groups:
          npm-dependencies:
              patterns: ['*']

    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: monthly
      open-pull-requests-limit: 1
      groups:
          github-actions:
              patterns: ['*']
