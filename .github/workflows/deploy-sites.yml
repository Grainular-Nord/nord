name: Build and deploy sites

on:
    workflow_dispatch:
        inputs:
            site:
                description: Site to deploy
                required: true
                default: all
                type: choice
                options:
                    - all
                    - nord
                    - docs
                    - aurora
                    - playground

permissions:
    contents: read

concurrency:
    group: deploy-sites-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build-packages:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build:packages
            - uses: actions/upload-artifact@v4
              with:
                  name: package-dist
                  path: packages/**/dist

    build-sites:
        needs: build-packages
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  name: package-dist
                  path: packages
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build:sites
            - uses: actions/upload-artifact@v4
              if: github.event_name == 'workflow_dispatch'
              with:
                  name: nordjs.dev
                  path: sites/nordjs.dev/dist
            - uses: actions/upload-artifact@v4
              if: github.event_name == 'workflow_dispatch'
              with:
                  name: docs.nordjs.dev
                  path: sites/docs.nordjs.dev/dist
            - uses: actions/upload-artifact@v4
              if: github.event_name == 'workflow_dispatch'
              with:
                  name: aurora.nordjs.dev
                  path: sites/aurora.nordjs.dev/dist
            - uses: actions/upload-artifact@v4
              if: github.event_name == 'workflow_dispatch'
              with:
                  name: playground.nordjs.dev
                  path: sites/playground.nordjs.dev/dist

    deploy:
        needs: build-sites
        runs-on: ubuntu-latest
        steps:
            - name: Configure SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.UPCLOUD_SSH_PRIVATE_KEY }}
                  SSH_KNOWN_HOSTS: ${{ secrets.UPCLOUD_KNOWN_HOSTS }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts
            - name: Validate deployment paths
              env:
                  SITE: ${{ inputs.site }}
                  NORD_PATH: ${{ secrets.UPCLOUD_NORD_PATH }}
                  DOCS_PATH: ${{ secrets.UPCLOUD_DOCS_PATH }}
                  AURORA_PATH: ${{ secrets.UPCLOUD_AURORA_PATH }}
                  PLAYGROUND_PATH: ${{ secrets.UPCLOUD_PLAYGROUND_PATH }}
              run: |
                  set -eu
                  validate_path() {
                      if [ -z "$2" ] || [ "$2" = "/" ]; then
                          echo "$1 deployment path is missing or points at the server root."
                          exit 1
                      fi
                  }

                  case "$SITE" in
                      all)
                          validate_path nord "$NORD_PATH"
                          validate_path docs "$DOCS_PATH"
                          validate_path aurora "$AURORA_PATH"
                          validate_path playground "$PLAYGROUND_PATH"
                          ;;
                      nord) validate_path nord "$NORD_PATH" ;;
                      docs) validate_path docs "$DOCS_PATH" ;;
                      aurora) validate_path aurora "$AURORA_PATH" ;;
                      playground) validate_path playground "$PLAYGROUND_PATH" ;;
                  esac
            - uses: actions/download-artifact@v4
              if: inputs.site == 'all' || inputs.site == 'nord'
              with:
                  name: nordjs.dev
                  path: dist/nordjs.dev
            - uses: actions/download-artifact@v4
              if: inputs.site == 'all' || inputs.site == 'docs'
              with:
                  name: docs.nordjs.dev
                  path: dist/docs.nordjs.dev
            - uses: actions/download-artifact@v4
              if: inputs.site == 'all' || inputs.site == 'aurora'
              with:
                  name: aurora.nordjs.dev
                  path: dist/aurora.nordjs.dev
            - uses: actions/download-artifact@v4
              if: inputs.site == 'all' || inputs.site == 'playground'
              with:
                  name: playground.nordjs.dev
                  path: dist/playground.nordjs.dev
            - name: Deploy nordjs.dev
              if: inputs.site == 'all' || inputs.site == 'nord'
              env:
                  DEPLOY_HOST: ${{ secrets.UPCLOUD_HOST }}
                  DEPLOY_USER: ${{ secrets.UPCLOUD_USER }}
                  DEPLOY_PATH: ${{ secrets.UPCLOUD_NORD_PATH }}
              run: rsync -az --delete dist/nordjs.dev/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
            - name: Deploy docs.nordjs.dev
              if: inputs.site == 'all' || inputs.site == 'docs'
              env:
                  DEPLOY_HOST: ${{ secrets.UPCLOUD_HOST }}
                  DEPLOY_USER: ${{ secrets.UPCLOUD_USER }}
                  DEPLOY_PATH: ${{ secrets.UPCLOUD_DOCS_PATH }}
              run: rsync -az --delete dist/docs.nordjs.dev/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
            - name: Deploy aurora.nordjs.dev
              if: inputs.site == 'all' || inputs.site == 'aurora'
              env:
                  DEPLOY_HOST: ${{ secrets.UPCLOUD_HOST }}
                  DEPLOY_USER: ${{ secrets.UPCLOUD_USER }}
                  DEPLOY_PATH: ${{ secrets.UPCLOUD_AURORA_PATH }}
              run: rsync -az --delete dist/aurora.nordjs.dev/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
            - name: Deploy playground.nordjs.dev
              if: inputs.site == 'all' || inputs.site == 'playground'
              env:
                  DEPLOY_HOST: ${{ secrets.UPCLOUD_HOST }}
                  DEPLOY_USER: ${{ secrets.UPCLOUD_USER }}
                  DEPLOY_PATH: ${{ secrets.UPCLOUD_PLAYGROUND_PATH }}
              run: rsync -az --delete dist/playground.nordjs.dev/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
