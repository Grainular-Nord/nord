# @format

# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md
#
pre-commit:
    parallel: false
    commands:
        format:
            run: npm run format -- {staged_files} --no-errors-on-unmatched
            stage_fixed: true
        lint:ts:
            run: npm run lint -- {staged_files} --no-errors-on-unmatched
            stage_fixed: true
commit-msg:
    commands:
        lint:
            run: npx commitlint --edit
