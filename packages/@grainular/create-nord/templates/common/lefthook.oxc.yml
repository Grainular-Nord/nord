pre-commit:
    parallel: true
    commands:
        oxfmt:
            glob: '*.{js,ts,json,md,yml,yaml}'
            run: npx oxfmt --write {staged_files} --no-error-on-unmatched-pattern
            stage_fixed: true
        oxlint:
            glob: '*.{js,ts}'
            run: npx oxlint {staged_files} --no-error-on-unmatched-pattern
