<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
    <title id="title">Nørd aurora logo</title>
    <desc id="description">A dark geometric letter N crossed by a flowing blue, mint, and violet aurora.</desc>

    <defs>
        <linearGradient id="structure" x1="92" y1="64" x2="420" y2="448" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#0a225d" />
            <stop offset="0.5" stop-color="#06143f" />
            <stop offset="1" stop-color="#08102f" />
        </linearGradient>
        <linearGradient id="aurora" x1="124" y1="72" x2="386" y2="438" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#08b9f2" />
            <stop offset="0.23" stop-color="#3ee8e2" />
            <stop offset="0.5" stop-color="#b7ffd8" />
            <stop offset="0.72" stop-color="#9da6ff" />
            <stop offset="1" stop-color="#7447ee" />
        </linearGradient>
        <linearGradient id="sheen" x1="133" y1="115" x2="377" y2="406" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
            <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.78" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
    </defs>

    <path fill="url(#structure)" d="M84 64h96v384H84zM332 64h96v384h-96z" />
    <path
        fill="url(#aurora)"
        d="M84 64h82q14 0 14 14c0 103 248 243 248 370h-82q-14 0-14-14c0-83-248-243-248-370Z"
    />
    <path
        class="aurora-sheen"
        fill="none"
        stroke="url(#sheen)"
        stroke-linecap="round"
        stroke-width="9"
        d="M134 78C143 181 369 335 378 434"
        opacity="0.72"
    />

    <style>
        @media (max-width: 48px) {
            .aurora-sheen {
                display: none;
            }
        }
    </style>
</svg>
